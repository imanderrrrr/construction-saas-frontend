<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=2560, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root { --paper: #F3EEE6; --ink: #17130F; --muted: #6C6152; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 2560px; height: 1080px; overflow: hidden; background: var(--paper); }
      #root { position: relative; width: 100%; height: 100%; background: var(--paper); }
      #sheet { position: absolute; inset: 0; background: var(--paper); }
      #world { position: absolute; left: 0; top: 0; width: 4800px; height: 1080px; filter: url(#w-hb); }
      #world svg { position: absolute; left: 0; top: 0; width: 4800px; height: 1080px; overflow: visible; }
      #edge-top, #edge-bottom { position: absolute; left: 0; width: 2560px; pointer-events: none; }
      #edge-top { top: 0; height: 170px; background: linear-gradient(to bottom, var(--paper) 0%, rgba(243,238,230,0) 100%); }
      #edge-bottom { top: 880px; height: 200px; background: linear-gradient(to top, var(--paper) 0%, rgba(243,238,230,0) 100%); }
      .lbl { position: absolute; font: 500 28px 'IBM Plex Mono', monospace; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
      #marks { position: absolute; left: 0; top: 0; width: 2560px; height: 1080px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.15" data-width="2560" data-height="1080">
      <svg width="0" height="0" style="position:absolute" aria-hidden="true" data-layout-ignore>
        <defs><filter id="w-hb" x="-10%" y="0%" width="120%" height="100%" color-interpolation-filters="sRGB"><feGaussianBlur id="w-hb-s" stdDeviation="0 0"/></filter></defs>
      </svg>
      <div id="sheet"></div>

      <!-- el mundo: cuadrícula de plano + terreno; viaja con la cámara -->
      <div id="world" data-layout-allow-overflow>
        <svg id="grid" viewBox="0 0 4800 1080" aria-hidden="true" style="clip-path:inset(46% 46% 46% 46%)">
          <defs>
            <pattern id="g-minor" width="80" height="80" patternUnits="userSpaceOnUse"><path d="M80 0 V80 M0 80 H80" fill="none" stroke="#D9CFBC" stroke-width="1.2"/></pattern>
            <pattern id="g-major" width="400" height="400" patternUnits="userSpaceOnUse"><path d="M400 0 V400 M0 400 H400" fill="none" stroke="#CBBFA6" stroke-width="2"/></pattern>
          </defs>
          <rect width="4800" height="1080" fill="url(#g-minor)"/>
          <rect width="4800" height="1080" fill="url(#g-major)"/>
        </svg>
        <svg id="ground" viewBox="0 0 4800 1080" aria-hidden="true">
          <defs>
            <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="18" stroke="#17130F" stroke-width="1.6" opacity=".5"/></pattern>
            <linearGradient id="hatch-fade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
            <mask id="hatch-mask"><rect x="0" y="800" width="4800" height="64" fill="url(#hatch-fade)"/></mask>
          </defs>
          <rect x="0" y="800" width="4800" height="64" fill="url(#hatch)" mask="url(#hatch-mask)" id="hatch-rect" style="opacity:0"/>
          <path id="ground-line" d="M0 800 H4800" pathLength="1" fill="none" stroke-dasharray="1 1" style="stroke-dashoffset:1" stroke="#17130F" stroke-width="5"/>
          <g id="level-mark" style="opacity:0">
            <path d="M150 772 L174 772 L162 794 Z" fill="#17130F"/>
            <text x="190" y="840" style="font:500 28px 'IBM Plex Mono',monospace;letter-spacing:.14em;fill:#17130F">NIVEL 0.00</text>
          </g>
        </svg>
      </div>

      <div id="edge-top"></div><div id="edge-bottom"></div>

      <!-- marcas de esquina y rótulos de la lámina -->
      <svg id="marks" viewBox="0 0 2560 1080" aria-hidden="true">
        <path id="crops" d="M108 54 H148 M128 34 V74 M2412 54 H2452 M2432 34 V74 M108 1026 H148 M128 1006 V1046 M2412 1026 H2452 M2432 1006 V1046" stroke="#17130F" stroke-width="2" fill="none" opacity="0"/>
      </svg>
      <div id="lbl-tl" class="lbl" style="left:160px;top:70px;opacity:0">ArchLogic Systems</div>
      <div id="lbl-tl2" class="lbl" style="left:160px;top:70px;opacity:0">BuildTrack</div>
      <div id="lbl-bl" class="lbl" style="left:160px;bottom:70px;opacity:0">Lámina 01 / 02 · Escala 1:50</div>
      <div id="lbl-bl2" class="lbl" style="left:160px;bottom:70px;opacity:0">Lámina 02 / 02 · Escala 1:50</div>
      <div id="lbl-br" class="lbl" style="right:160px;bottom:70px;opacity:0">NIVEL ±0.00 · EJE A-1 — PUNTO DE REFERENCIA</div>

      <div id="plano" data-composition-id="plano" data-composition-src="compositions/plano.html"
        data-start="0" data-duration="4.95" data-track-index="1" data-track-kind="graphics" data-width="2560" data-height="1080"></div>
      <div id="obra" data-composition-id="obra" data-composition-src="compositions/obra.html"
        data-start="3.75" data-duration="5.4" data-track-index="2" data-track-kind="graphics" data-width="2560" data-height="1080"></div>

      <!-- Música: colchón de pads sin batería; su subida (≈6.5 s) llega a su cima cuando la grúa suelda el trazo -->
      <audio id="bgm" class="clip" src="assets/music/obra-bed.mp3" data-start="0" data-duration="9.15" data-track-index="10" data-volume="0.28" data-fade-in="0.6" data-fade-out="1.4"></audio>
      <!-- 1.50 · la base negra de la marca se rellena -->
      <audio id="sfx-foundation" class="clip" src="assets/sfx/impact-bass-1.mp3" data-start="1.45" data-duration="1.2" data-track-index="11" data-volume="0.22" data-fade-out="0.6"></audio>
      <!-- 1.70 · la A naranja se rellena -->
      <audio id="sfx-orange" class="clip" src="assets/sfx/pop.mp3" data-start="1.6" data-duration="0.72" data-track-index="12" data-volume="0.3" ></audio>
      <!-- 2.15 · la marca cede el centro -->
      <audio id="sfx-slide" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="1.99" data-duration="0.57" data-track-index="13" data-volume="0.26" ></audio>
      <!-- 2.35 · sube el nombre: el mismo whoosh, más lento y suave -->
      <audio id="sfx-name" class="clip" src="assets/sfx/whoosh-short.mp3" data-start="2.14" data-duration="0.77" data-track-index="14" data-volume="0.16" data-playback-rate="0.75"></audio>
      <!-- 4.07 · tensión bajo la pausa; cima en lo más rápido del barrido hacia la obra -->
      <audio id="sfx-whip" class="clip" src="assets/sfx/whoosh-cinematic.mp3" data-start="2.67" data-duration="2.9" data-track-index="15" data-volume="0.3" data-media-start="1.5" data-fade-in="0.7" data-fade-out="0.9"></audio>
      <!-- 4.0–5.0 · se levantan andamio y grúa -->
      <audio id="sfx-assemble" class="clip" src="assets/sfx/rattle-assembly.mp3" data-start="4" data-duration="1.77" data-track-index="16" data-volume="0.22" data-fade-out="0.4"></audio>
      <!-- 4.65 · un acople encaja -->
      <audio id="sfx-cp1" class="clip" src="assets/sfx/clink.mp3" data-start="4.58" data-duration="1" data-track-index="17" data-volume="0.16" ></audio>
      <!-- 4.9 · otro acople -->
      <audio id="sfx-cp2" class="clip" src="assets/sfx/strike-ring.mp3" data-start="4.8" data-duration="1" data-track-index="18" data-volume="0.15" ></audio>
      <!-- 5.13 · otro acople -->
      <audio id="sfx-cp3" class="clip" src="assets/sfx/clink.mp3" data-start="5.06" data-duration="1" data-track-index="19" data-volume="0.14" ></audio>
      <!-- 5.17 · primera hilera -->
      <audio id="sfx-b1" class="clip" src="assets/sfx/thud-heavy.mp3" data-start="5.12" data-duration="0.79" data-track-index="20" data-volume="0.3" ></audio>
      <!-- 5.45 · hilera -->
      <audio id="sfx-b2" class="clip" src="assets/sfx/thud-muffled.mp3" data-start="5.4" data-duration="0.82" data-track-index="21" data-volume="0.26" ></audio>
      <!-- 5.73 · hilera -->
      <audio id="sfx-b3" class="clip" src="assets/sfx/thud-room.mp3" data-start="5.68" data-duration="1" data-track-index="22" data-volume="0.26" ></audio>
      <!-- 5.93 · hilera de «Track» -->
      <audio id="sfx-b4" class="clip" src="assets/sfx/thud-heavy.mp3" data-start="5.88" data-duration="0.79" data-track-index="23" data-volume="0.24" ></audio>
      <!-- 6.07 · última hilera -->
      <audio id="sfx-b5" class="clip" src="assets/sfx/thud-muffled.mp3" data-start="6.02" data-duration="0.82" data-track-index="24" data-volume="0.22" ></audio>
      <!-- 6.87 · la grúa asienta el trazo: un pequeño crescendo y el golpe -->
      <audio id="sfx-arrival" class="clip" src="assets/sfx/impact-bass-2.mp3" data-start="6.47" data-duration="1.14" data-track-index="25" data-volume="0.24" data-media-start="1.45" data-fade-out="0.3"></audio>
      <!-- 6.87 · contacto metálico -->
      <audio id="sfx-contact" class="clip" src="assets/sfx/clunk-scrape.mp3" data-start="6.84" data-duration="0.82" data-track-index="26" data-volume="0.3" ></audio>
      <!-- 6.9 · chispas de soldadura -->
      <audio id="sfx-sparks" class="clip" src="assets/sfx/sparkle.mp3" data-start="6.86" data-duration="1.8" data-track-index="27" data-volume="0.2" data-fade-out="0.8"></audio>
      <!-- 7.25 · se corta la cinta de obra -->
      <audio id="sfx-tape" class="clip" src="assets/sfx/rip-tape.mp3" data-start="7.15" data-duration="0.98" data-track-index="28" data-volume="0.3" ></audio>
      <!-- 7.4–8.1 · se desarma el andamio -->
      <audio id="sfx-dismantle" class="clip" src="assets/sfx/rattle-pieces.mp3" data-start="7.25" data-duration="1.67" data-track-index="29" data-volume="0.26" data-fade-out="0.4"></audio>
    </div>
    <script>
      const PAN = 2240, PAN_AT = 3.75, PAN_DUR = 1;
      
    const whip = (() => {
      const a = 0.32, b = (4 / (1 - a)) / (2 / a + 4 / (1 - a));
      return t => t < a ? b * Math.pow(t / a, 2) : b + (1 - b) * (1 - Math.pow(1 - (t - a) / (1 - a), 4));
    })();
      const tl = gsap.timeline({ paused: true });

      // La hoja de dibujo: la cuadrícula se despliega desde el centro, baja el terreno, aparecen los rótulos.
      tl.fromTo('#grid', { clipPath: 'inset(46% 46% 46% 46%)' }, { clipPath: 'inset(0% 0% 0% 0%)', duration: 1.1, ease: 'expo.out' }, 0.05);
      tl.fromTo('#ground-line', { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: 'power2.out' }, 0.3);
      tl.fromTo('#hatch-rect', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.out' }, 0.7);
      tl.fromTo('#level-mark', { opacity: 0 }, { opacity: 1, duration: 0.4, ease: 'power1.out' }, 0.8);
      tl.fromTo('#crops', { opacity: 0 }, { opacity: 0.7, duration: 0.5, ease: 'power1.out' }, 0.5);
      tl.fromTo('#lbl-tl, #lbl-bl, #lbl-br', { opacity: 0 }, { opacity: 1, duration: 0.6, ease: 'power1.out', stagger: 0.08 }, 0.9);

      // El barrido: el mundo viaja con la cámara (mismo recorrido y desenfoque que los logos).
      tl.fromTo('#world', { x: 0 }, { x: -PAN, duration: PAN_DUR, ease: whip, immediateRender: false }, PAN_AT);
      
    tl.fromTo('#w-hb-s', { attr: { stdDeviation: '0 0' } }, { attr: { stdDeviation: '13 0' }, duration: PAN_DUR * 0.32, ease: 'none' }, PAN_AT);
    tl.fromTo('#w-hb-s', { attr: { stdDeviation: '13 0' } }, { attr: { stdDeviation: '0 0' }, duration: PAN_DUR * 0.68, ease: 'power3.out', immediateRender: false }, PAN_AT + PAN_DUR * 0.32);
      // Los rótulos pasan a la lámina 02 y a BuildTrack.
      tl.fromTo('#lbl-tl, #lbl-bl', { opacity: 1 }, { opacity: 0, duration: 0.25, ease: 'power1.in', immediateRender: false }, PAN_AT + 0.25);
      tl.fromTo('#lbl-tl2, #lbl-bl2', { opacity: 0 }, { opacity: 1, duration: 0.35, ease: 'power1.out' }, PAN_AT + 0.55);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
