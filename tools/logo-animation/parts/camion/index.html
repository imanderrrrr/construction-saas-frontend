    for (t = 1.3; t < 3.46; t += 0.13) { var sp = stackPos(t); puffs.push({ t0: t, life: 0.8, x0: sp[0], y0: sp[1], vx: 14 + 14 * R(), vy: -40 - 24 * R(), r0: 2.5, r1: 9 + 5 * R(), a: 0.5, kind: 'smoke', back: false }); }
    // arranque: humo negro a pulsos (una bocanada por fotograma, más densa al acelerar)
    for (t = 3.48; t < 4.14; t += 1 / 60) { var sp2 = stackPos(t), up = clamp((t - 3.48) / 0.7, 0, 1), pulse = 0.75 + 0.25 * Math.sin(2 * PI * 9 * t); puffs.push({ t0: t, life: 0.74 + 0.1 * R(), x0: sp2[0] + (R() - .5) * 3, y0: sp2[1], vx: -30 - 50 * up + 16 * R(), vy: -68 - 36 * R(), r0: 5 + 2 * pulse, r1: (23 + 12 * R() + 12 * up) * pulse, a: 0.95, kind: 'smoke', back: false }); }
    // golpe de la caja al asentarse sobre el chasis
    for (i = 0; i < 4; i++) { var tp = 3.53 + i * 0.015; puffs.push({ t0: tp, life: 0.45, x0: 872 + dxT(tp) - 4 + R() * 8, y0: 276 + R() * 8, vx: -50 - 40 * R(), vy: -6 - 10 * R(), r0: 3, r1: 11 + 5 * R(), a: 0.3, kind: 'dust', back: false }); }
    // arranque: polvo de las ruedas
    for (t = 3.68; t < 4.2; t += 0.022) { var w3 = wheelContact(t, Math.floor(R() * 2)); puffs.push({ t0: t, life: 0.55 + 0.25 * R(), x0: w3[0] - 8 + R() * 10, y0: w3[1] - 3, vx: -50 - 90 * R(), vy: -12 - 26 * R(), r0: 5, r1: 18 + 14 * R(), a: 0.46, kind: 'dust', back: false }); }
    // polvo en la boca de descarga mientras sale la carga
    for (t = 1.98; t < 2.95; t += 0.05) { var lp = bedToWorld(chain(t), 868, 246); puffs.push({ t0: t, life: 0.5 + 0.2 * R(), x0: lp[0] - 4, y0: lp[1] + 6, vx: -50 - 40 * R(), vy: 8 + 14 * R(), r0: 6, r1: 20 + 8 * R(), a: 0.34, kind: 'dust', back: true }); }
    // aterrizaje de las letras
    Object.keys(LETS).forEach(function (k) {
      var L = LETS[k];
      puffs.push({ t0: L.tc, life: 0.62, x0: L.xc, y0: GEO.deckY - 3, vx: -30, vy: -26, r0: 8, r1: 34, a: 0.62, kind: 'dust', back: true });
      puffs.push({ t0: L.tc + 0.05, life: 0.55, x0: L.xc + 16, y0: GEO.deckY - 2, vx: 25, vy: -22, r0: 6, r1: 26, a: 0.5, kind: 'dust', back: true });
    });
    puffs.forEach(function (p) {
      p.el = mk('circle', { r: 1, fill: p.kind === 'dust' ? 'url(#cam-gr-dust)' : 'url(#cam-gr-smoke)', opacity: 0 });
      (p.back ? fxb : fxf).appendChild(p.el);
    });
  })();
  function puffUpdate(t) {
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i], tau = t - p.t0;
      if (tau < 0 || tau > p.life) { if (p.on) { p.el.setAttribute('opacity', '0'); p.on = false; } continue; }
      var u = tau / p.life, drag = tau * (1 - 0.5 * u);
      var x = p.x0 + p.vx * drag, y = p.y0 + p.vy * drag - (p.kind === 'smoke' ? 6 * u * u * 0 : 0);
      var r = lerp(p.r0, p.r1, 1 - Math.pow(1 - u, 2));
      var a = p.a * Math.pow(1 - u, 1.15) * smooth(tau / 0.05);
      p.el.setAttribute('cx', fx(x)); p.el.setAttribute('cy', fx(y)); p.el.setAttribute('r', fx(r)); p.el.setAttribute('opacity', fx(a * 100) / 100 + ''); p.on = true;
    }
  }

  /* ---------- aplicar la pose ---------- */
  var elTrkB = $('cam-b-trk'), elBodyB = $('cam-b-body'), elBedB = $('cam-b-bedg'), elShadow = $('cam-b-sh');
  var elTrkF = $('cam-f-trk'), elLow = $('cam-f-low'), elUp = $('cam-f-bodyup'), elBedF = $('cam-f-bedg'), elGate = $('cam-f-gate');
  var elRam = { r: $('cam-ram'), s2: $('cam-ram-s2'), s3: $('cam-ram-s3') };
  var elW = GEO.wheels.map(function (w) { return { spin: $('cam-' + w.id + '-spin'), r: w.r }; });
  var glint = { win: $('cam-glint-win'), bed: $('cam-glint-bed') };
  var lamp = { rev: $('cam-lamp-rev'), brk: $('cam-lamp-brk'), glowRev: $('cam-glow-rev'), glowBrk: $('cam-glow-brk'), beacon: $('cam-glow-beacon'), coneRev: $('cam-cone-rev'), coneFwd: $('cam-cone-fwd'), head: $('cam-glow-head'), driver: $('cam-driver') };
  var RAM_B = GEO.ramB, RAM_T = GEO.ramT, S1 = 40;
  var RAM_L0 = Math.hypot(RAM_T[0] - RAM_B[0], RAM_T[1] - RAM_B[1]);
  var ramTail = RAM_L0 - S1 - 12;

  function setT(el, s) { el.setAttribute('transform', s); }
  function setO(el, v) { el.setAttribute('opacity', v); }

  function pose(t) {
    t = clamp(t, 0, DUR);
    var ch = chain(t), cs = chainStr(ch);
    // truck
    var trk = 'translate(' + fx(ch.dx) + ' 0)';
    setT(elTrkB, trk); setT(elTrkF, trk); setT(elShadow, trk);
    var body = 'translate(0 ' + fx(ch.hv) + ') rotate(' + fx(ch.pt) + ' ' + C0[0] + ' ' + C0[1] + ')';
    setT(elBodyB, body); setT(elLow, body); setT(elUp, body);
    var bed = 'rotate(' + fx(-ch.th) + ' ' + H[0] + ' ' + H[1] + ')';
    setT(elBedB, bed); setT(elBedF, bed);
    setT(elGate, 'rotate(' + fx(ch.ga) + ' ' + GEO.gateG[0] + ' ' + GEO.gateG[1] + ')');
    // wheels
    for (var i = 0; i < elW.length; i++) setT(elW[i].spin, 'rotate(' + fx(ch.dx / elW[i].r * DEG) + ')');
    // hoist ram (pivots: base fixed on frame, top on the bed; length computed between pivots)
    var T = rotPt(RAM_T[0], RAM_T[1], H[0], H[1], -ch.th);
    var dxr = T[0] - RAM_B[0], dyr = T[1] - RAM_B[1], Lr = Math.hypot(dxr, dyr), e = Math.max(0, Lr - RAM_L0);
    setT(elRam.r, 'translate(' + RAM_B[0] + ' ' + RAM_B[1] + ') rotate(' + fx(Math.atan2(dyr, dxr) * DEG) + ')');
    var p2 = S1 + 6 + e / 2, p3 = p2 + 6 + e / 2;
    setT(elRam.s2, 'translate(' + fx(p2) + ' 0)'); setT(elRam.s3, 'translate(' + fx(p3) + ' 0)');
    // lights
    var rev = (t >= 1.02 && t < 2.02) ? 1 : 0, brk = ((t >= 1.45 && t < 2.15) || (t >= 3.50 && t < 3.70)) ? 1 : 0;
    var ph = ((t - 1.0) / 0.36) % 1, bea = (t >= 1.0 && t < 3.75) ? (ph < 0.5 ? 1 : 0.1) : 0;
    setO(lamp.rev, rev ? 1 : 0.28); setO(lamp.glowRev, rev); setO(lamp.coneRev, rev ? fx(clamp((1400 - (874 + ch.dx)) / 50, 0, 1)) : 0);
    setO(lamp.brk, brk ? 1 : 0.3); setO(lamp.glowBrk, brk);
    setO(lamp.beacon, bea); setO(lamp.coneFwd, 0);
    setT(lamp.driver, 'translate(' + fx(t < 2.0 ? -2.4 * smooth((t - 1.1) / 0.3) : -2.4 * (1 - smooth((t - 2.0) / 0.4))) + ' 0)');
    // brillos que barren el cristal y el costado de la caja al pasar bajo la luz
    var gx = t < 3.3 ? smooth((t - 1.15) / 0.8) : smooth((t - 3.66) / 0.7);
    setT(glint.win, 'translate(' + fx(-30 + 130 * gx) + ' 0)');
    setT(glint.bed, 'translate(' + fx(-10 + 190 * gx) + ' 0)');
    // cargo
    moundUpdate(t, cs);
    for (i = 0; i < chunks.length; i++) {
      var c = chunks[i], el = c.el;
      if (t < c.tExit) {
        var l = c.local(t);
        el.setAttribute('transform', cs + ' translate(' + fx(l[0]) + ' ' + fx(l[1]) + ') rotate(' + fx(l[2]) + ')');
        if (!c.vis) { el.setAttribute('opacity', '1'); c.vis = true; }
      } else {
        var k = (t - c.tExit) * FPS, i0 = Math.floor(k), n = c.samples.length;
        if (i0 >= n - 1) { if (c.vis !== 0) { el.setAttribute('opacity', '0'); c.vis = 0; } continue; }
        var a = c.samples[i0], b = c.samples[i0 + 1], f = k - i0;
        el.setAttribute('transform', 'translate(' + fx(lerp(a[0], b[0], f)) + ' ' + fx(lerp(a[1], b[1], f)) + ') rotate(' + fx(lerp(a[2], b[2], f)) + ') scale(' + fx(lerp(a[3], b[3], f)) + ')');
        el.setAttribute('opacity', fx(lerp(a[4], b[4], f))); c.vis = true;
      }
    }
    // letters
    Object.keys(LETS).forEach(function (key) {
      var L = LETS[key], x, y, r;
      if (t < L.tExit) { var l = L.local(t), w = bedToWorld(ch, l[0], l[1]); x = w[0]; y = w[1]; r = l[2] + ch.pt - ch.th; }
      else if (t < L.tc) { var a = L.air(t); x = a[0]; y = a[1]; r = a[2]; }
      else if (t < L.tRest) { var s = L.settle(t - L.tc); x = s[0]; y = s[1]; r = s[2]; }
      else { x = L.fx; y = L.fy; r = 0; }
      var tr = (t >= L.tRest) ? 'translate(' + L.fx + ' ' + L.fy + ') rotate(0) translate(' + (-L.fx) + ' ' + (-L.fy) + ')' : 'translate(' + fx(x) + ' ' + fx(y) + ') rotate(' + fx(r) + ') translate(' + (-L.fx) + ' ' + (-L.fy) + ')';
      L.el.setAttribute('transform', tr); L.elIn.setAttribute('transform', tr);
      var sw = smooth((t - (L.tExit - 0.03)) / 0.08);
      L.el.setAttribute('opacity', fx(sw)); L.elIn.setAttribute('opacity', fx(1 - sw));
    });
    puffUpdate(t);
  }

  gsap.registerPlugin({ name: 'camSim', init: function () {}, render: function (progress) { pose(progress * DUR); } });
  pose(0);
  var tl = gsap.timeline({ paused: true });
  tl.to({}, { camSim: 1, duration: DUR, ease: 'none' }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
  window.__camPose = pose;
  window.__camDebug = debug;
})();

    </script>
  </body>
