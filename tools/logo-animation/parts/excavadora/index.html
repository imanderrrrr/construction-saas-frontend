    <script>
/* ====================================================================================================
   EXCAVADORA — pieza del logo animado «BuildTrack se construye»
   Todo el movimiento es una función pura del tiempo: un solo tween de GSAP recorre 0 → 5,6 s y en cada
   instante `render(t)` calcula la cinemática (cuerpo, orugas, pluma, brazo, cuchara, cilindros por
   distancia entre pivotes), las partículas (polvo, humo, terrones), la carga y las letras.
   Sin Math.random (PRNG con semilla), sin Date, sin repeat:-1.
   ==================================================================================================== */
(function () {
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const D2R = Math.PI / 180;
  const GROUND = 324, SLAB = 290, MX = 118;           // suelo, cara superior de la losa, X final del cuerpo
  const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
  const mix = (a, b, p) => a + (b - a) * p;
  const ramp = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
  const f2 = (v) => (Math.round(v * 100) / 100).toString();
  const $ = (id) => document.getElementById(id);
  const EZ = {};
  const E = (n) => EZ[n] || (EZ[n] = gsap.parseEase(n));
  function seg(k, t) {                                  // pista de fotogramas clave: [tiempo, valor, ease del tramo que llega]
    if (t <= k[0][0]) return k[0][1];
    for (let i = 1; i < k.length; i++) {
      if (t <= k[i][0]) {
        const a = k[i - 1], b = k[i];
        return a[1] + (b[1] - a[1]) * E(b[2] || 'none')((t - a[0]) / (b[0] - a[0]));
      }
    }
    return k[k.length - 1][1];
  }
  function rng(seed) {                                  // mulberry32
    let a = seed >>> 0;
    return function () {
      a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  /* ---------------- paleta ---------------- */
  const Y1 = '#FFD35C', Y2 = '#F6B21C', Y3 = '#D68A06', Y4 = '#A86A00', YO = '#6E4300';
  const S0 = '#1A1612', S1 = '#CFC6B6', S2 = '#A79B88', S3 = '#7D7263', S4 = '#4A423A', S5 = '#2B2621';
  const T1 = '#A07848', T2 = '#7A5636', T3 = '#4E3622', T4 = '#35251A';
  const GL1 = '#BFE3EE', GL2 = '#8DC3D6', GL3 = '#4F8CA3', RUB = '#0D0B09';

  /* ====================================================================================================
     CINEMÁTICA Y GUION (puro, sin DOM)
     Coordenadas locales de la máquina: u hacia delante, v hacia abajo, origen = suelo bajo el centro de las orugas.
     ==================================================================================================== */
  /*PURE-START*/
  const P0 = { u: 58, v: -74 };                         // pie de la pluma
  const L1 = 210, L2 = 170, LT = 100;                   // pluma, brazo, pivote→punta del diente
  const W2 = (x, y) => [x - MX, y - GROUND];

  // posición del cuerpo
  const XK = [[0, -300], [0.62, MX, 'power2.out'], [2.76, MX], [3.58, -236, 'power2.in']];
  // pivote de la cuchara (muñeca) en coordenadas del lienzo, como si el cuerpo ya estuviera en MX
  const WXK = [[0, 226], [0.20, 226], [0.46, 250, 'power2.inOut'], [0.56, 246, 'power2.in'], [0.72, 228, 'power2.inOut'],
    [0.84, 325, 'power2.out'], [1.00, 428, 'power1.inOut'], [1.12, 445, 'power2.inOut'], [1.14, 445],
    [1.34, 250, 'power2.inOut'], [1.38, 246], [1.52, 228, 'power2.inOut'],
    [1.60, 325, 'power2.out'], [1.68, 430, 'power1.inOut'], [1.82, 502, 'power2.inOut'], [1.90, 502],
    [2.08, 460, 'power2.out'], [2.30, 290, 'power2.inOut'], [2.44, 226, 'power2.inOut']];
  const WYK = [[0, 240], [0.20, 240], [0.46, 190, 'power2.inOut'], [0.56, 214, 'power2.in'], [0.72, 198, 'power2.out'],
    [0.84, 134, 'power2.out'], [0.98, 130], [1.12, 240, 'power2.inOut'], [1.14, 240],
    [1.22, 168, 'power2.out'], [1.32, 190, 'power2.inOut'], [1.38, 214, 'power2.in'], [1.52, 198, 'power2.out'],
    [1.60, 134, 'power2.out'], [1.68, 128], [1.82, 241, 'power2.inOut'], [1.90, 241],
    [2.08, 150, 'power2.out'], [2.16, 112, 'power2.out'], [2.30, 126], [2.44, 240, 'power2.in']];
  const A3K = [[0, 150], [0.20, 150], [0.46, 108, 'power2.out'], [0.56, 100, 'power2.in'], [0.72, 152, 'power2.inOut'], [0.90, 152],
    [1.12, 20, 'power2.inOut'], [1.14, 20], [1.17, 4, 'power2.out'], [1.20, 18, 'power2.inOut'], [1.24, 6, 'power2.out'], [1.32, 108, 'power2.inOut'], [1.38, 100, 'power2.in'], [1.52, 152, 'power2.inOut'], [1.60, 152],
    [1.82, 20, 'power2.inOut'], [1.86, 20], [1.89, 4, 'power2.out'], [1.92, 18, 'power2.inOut'], [1.96, 6, 'power2.out'], [2.08, 70, 'power2.inOut'], [2.44, 150, 'power2.inOut']];
  const FLIP = [2.46, 2.78];                            // media vuelta de la torreta

  function swingX(t) {
    const s = Math.cos(Math.PI * E('power2.inOut')(ramp(t, FLIP[0], FLIP[1])));
    return Math.abs(s) < 0.04 ? (s < 0 ? -0.04 : 0.04) : s;
  }
  function spring(fn, t, f, z, T) {                     // respuesta de un muelle amortiguado (ganancia 1)
    const w0 = 2 * Math.PI * f, wd = w0 * Math.sqrt(1 - z * z), n = 28, dt = T / n;
    let acc = 0;
    for (let i = 0; i < n; i++) {
      const tau = (i + 0.5) * dt;
      acc += (w0 * w0 / wd) * Math.exp(-z * w0 * tau) * Math.sin(wd * tau) * fn(t - tau) * dt;
    }
    return acc;
  }
  const accX = (t) => { const h = 0.012; return clamp((seg(XK, t + h) - 2 * seg(XK, t) + seg(XK, t - h)) / (h * h), -2200, 2200); };
  const reachIn = (t) => clamp((seg(WXK, t) - MX - 120) / 180, 0, 1.4);
  const accW = (t) => { const h = 0.01; return clamp((seg(WXK, t + h) - 2 * seg(WXK, t) + seg(WXK, t - h)) / (h * h), -30000, 30000); };
  const pitchIn = (t) => -0.00055 * accX(t) + 0.5 * reachIn(t) - 0.00003 * accW(t);
  const LOADS = [[0.62, 1.12], [1.46, 1.84]];           // la cuchara va cargada
  const loadF = (t) => { let v = 0; for (const [a, b] of LOADS) v = Math.max(v, ramp(t, a, a + 0.1) * (1 - ramp(t, b - 0.05, b + 0.05))); return v; };
  const pulse = (t, a, b, h) => (t > a && t < b ? h * Math.sin(Math.PI * (t - a) / (b - a)) : 0);
  const sinkIn = (t) => 2.3 * loadF(t) - pulse(t, 0.55, 0.62, 1.4) - pulse(t, 1.37, 1.44, 1.2);

  function stateAt(t) {
    return {
      t, X: seg(XK, t), Wu: seg(WXK, t) - MX, Wv: seg(WYK, t) - GROUND, a3: seg(A3K, t),
      sx: swingX(t),
      pitch: spring(pitchIn, t, 4.2, 0.30, 0.8),
      dy: spring(sinkIn, t, 5.5, 0.38, 0.7),
    };
  }
  function toWorld(S, u, v) {
    const x = u * S.sx, c = Math.cos(S.pitch * D2R), s = Math.sin(S.pitch * D2R);
    return { x: S.X + x * c - v * s, y: GROUND + S.dy + x * s + v * c };
  }
  function toLocal(S, x, y) {
    const c = Math.cos(S.pitch * D2R), s = Math.sin(S.pitch * D2R), dx = x - S.X, dy = y - GROUND - S.dy;
    return { u: (dx * c + dy * s) / S.sx, v: -dx * s + dy * c };
  }
  // cinemática inversa pluma+brazo (codo hacia arriba) → ángulos y puntos
  function armAt(S) {
    const dx = S.Wu - P0.u, dy = S.Wv - P0.v;
    const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 2, L1 + L2 - 1);
    const base = Math.atan2(dy, dx);
    const A = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
    const a1 = base - A;
    const E1u = P0.u + L1 * Math.cos(a1), E1v = P0.v + L1 * Math.sin(a1);
    const Wu = P0.u + d * Math.cos(base), Wv = P0.v + d * Math.sin(base);
    const a2 = Math.atan2(Wv - E1v, Wu - E1u);
    return { a1, a2, a3: S.a3 * D2R, E1u, E1v, Wu, Wv, reach: d };
  }
  const rotp = (a, x, y) => ({ x: x * Math.cos(a) - y * Math.sin(a), y: x * Math.sin(a) + y * Math.cos(a) });
  // eslabón H + biela: todo en el marco del brazo
  const KPT = { x: 150, y: -14 }, CBS = { x: 50, y: -28 };
  const D_R = 30, D_DEG = -35, A_R = 30, A_DEG = -150, DOGL = 40, B1 = { x: -3, y: -38 };
  function linkAt(A) {
    const rel = A.a3 - A.a2;
    const b = rotp(rel, B1.x, B1.y), Bx = L2 + b.x, By = b.y;
    let ux = Bx - KPT.x, uy = By - KPT.y;
    let d = Math.hypot(ux, uy);
    const dmin = Math.abs(DOGL - D_R) + 0.5, dmax = D_R + DOGL - 0.5;
    const ok = d >= dmin && d <= dmax;
    const dd = clamp(d, dmin, dmax);
    ux /= d; uy /= d;
    const a = (D_R * D_R - DOGL * DOGL + dd * dd) / (2 * dd);
    const h = Math.sqrt(Math.max(0, D_R * D_R - a * a));
    const Dx = KPT.x + ux * a + uy * h, Dy = KPT.y + uy * a - ux * h;     // lado «arriba» del eslabón
    const phi = Math.atan2(Dy - KPT.y, Dx - KPT.x) - D_DEG * D2R;
    const ap = rotp(phi, A_R * Math.cos(A_DEG * D2R), A_R * Math.sin(A_DEG * D2R));
    return { phi, Dx, Dy, Bx, By, Ax: KPT.x + ap.x, Ay: KPT.y + ap.y, ok, d };
  }
  // puntos de anclaje de los cilindros
  const HB = { u: 28, v: -81 };                         // base del cilindro de la pluma (tras la cabina)
  const BB = { x: 132, y: 18 }, BA = { x: 156, y: -40 };  // pluma: vientre y lomo
  const SA = { x: -24, y: -24 };                        // brazo: cola
  function cylsAt(A, K) {
    const c1 = Math.cos(A.a1), s1 = Math.sin(A.a1), c2 = Math.cos(A.a2), s2 = Math.sin(A.a2);
    const P = (a, x, y) => ({ u: a.u + (x * (a.c) - y * (a.s)), v: a.v + (x * (a.s) + y * (a.c)) });
    const boom = { u: P0.u, v: P0.v, c: c1, s: s1 }, stick = { u: A.E1u, v: A.E1v, c: c2, s: s2 };
    const bb = P(boom, BB.x, BB.y), ba = P(boom, BA.x, BA.y), sa = P(stick, SA.x, SA.y);
    const cb = P(stick, CBS.x, CBS.y), ka = P(stick, K.Ax, K.Ay);
    return {
      boom: { a: HB, b: bb, L: Math.hypot(bb.u - HB.u, bb.v - HB.v) },
      arm: { a: ba, b: sa, L: Math.hypot(sa.u - ba.u, sa.v - ba.v) },
      buck: { a: cb, b: ka, L: Math.hypot(ka.u - cb.u, ka.v - cb.v) },
    };
  }
  /*PURE-END*/

  /* ---------------- depuración ---------------- */
  const STATS = { cyl: { boom: [1e9, 0], arm: [1e9, 0], buck: [1e9, 0] }, maxReach: 0, bad: [], a1: [9, -9], a2: [9, -9], rel: [9, -9] };
  (function scan() {
    for (let t = 0; t <= 3.8; t += 1 / 60) {
      const S = stateAt(t), A = armAt(S), K = linkAt(A), C = cylsAt(A, K);
      for (const k of ['boom', 'arm', 'buck']) { STATS.cyl[k][0] = Math.min(STATS.cyl[k][0], C[k].L); STATS.cyl[k][1] = Math.max(STATS.cyl[k][1], C[k].L); }
      STATS.maxReach = Math.max(STATS.maxReach, A.reach);
      if (!K.ok) STATS.bad.push(+t.toFixed(2));
      STATS.a1 = [Math.min(STATS.a1[0], A.a1 / D2R), Math.max(STATS.a1[1], A.a1 / D2R)];
      STATS.a2 = [Math.min(STATS.a2[0], A.a2 / D2R), Math.max(STATS.a2[1], A.a2 / D2R)];
      STATS.rel = [Math.min(STATS.rel[0], (A.a3 - A.a2) / D2R), Math.max(STATS.rel[1], (A.a3 - A.a2) / D2R)];
    }
  })();
  const LB = { boom: 0.8 * STATS.cyl.boom[0], arm: 0.8 * STATS.cyl.arm[0], buck: 0.8 * STATS.cyl.buck[0] };

  /* ====================================================================================================
     DEFINICIONES (degradados)
     ==================================================================================================== */
  const defs = $('exc-defs');
  function hard(id, cols, stops, vertical) {
    let s = '<linearGradient id="' + id + '" x1="0" y1="0" x2="' + (vertical === false ? 1 : 0) + '" y2="' + (vertical === false ? 0 : 1) + '">';
    s += '<stop offset="0" stop-color="' + cols[0] + '"/><stop offset="' + stops[0] + '" stop-color="' + cols[0] + '"/>';
    s += '<stop offset="' + stops[0] + '" stop-color="' + cols[1] + '"/><stop offset="' + stops[1] + '" stop-color="' + cols[1] + '"/>';
    s += '<stop offset="' + stops[1] + '" stop-color="' + cols[2] + '"/><stop offset="1" stop-color="' + cols[2] + '"/></linearGradient>';
    return s;
  }
  defs.innerHTML =
    hard('exc-gY', [Y1, Y2, Y3], [0.2, 0.74]) +
    hard('exc-gYd', ['#E8A41B', '#C98A0B', '#9B6600'], [0.2, 0.7]) +
    hard('exc-gSteel', [S1, S2, S3], [0.22, 0.7]) +
    hard('exc-gDark', [S3, S4, S5], [0.25, 0.7]) +
    hard('exc-gSoil', [T1, T2, T3], [0.22, 0.7]) +

      if (c.y0 > (onSlab(c.x0) ? SLAB : GROUND) - c.size * 0.55 - 2) c.y0 = (onSlab(c.x0) ? SLAB : GROUND) - c.size * 0.55 - 2;
      // aterrizaje: se resuelve con y(τ)=suelo (el suelo depende de la x de caída)
      let tau = 0.3;
      for (let it = 0; it < 4; it++) { const xx = c.x0 + c.vx * tau; const fl = (onSlab(xx) ? SLAB : GROUND) - c.size * 0.55; const disc = c.vy * c.vy + 2 * GRAV * (fl - c.y0); tau = disc > 0 ? (-c.vy + Math.sqrt(disc)) / GRAV : 0.3; }
      c.tl = c.td + tau; c.xl2 = c.x0 + c.vx * tau; c.floor = (onSlab(c.xl2) ? SLAB : GROUND) - c.size * 0.55;
      c.hold = 0.05 + (c.size > 8 ? 0.03 : 0); c.fade = 0.15;
      c.end = c.tl + c.hold + c.fade;
    });
    const fb = $('exc-clodsBack'), ff = $('exc-clodsFront');
    CLODS.forEach((c, i) => {
      const sh = CLODS.shapes[c.shape];
      const g = document.createElementNS(NS, 'g');
      g.setAttribute('id', 'exc-clod' + i);
      g.innerHTML = '<path d="' + sh[0] + '" fill="' + (c.kind === 'cargo' ? T2 : T1) + '" stroke="' + T4 + '" stroke-width="0.14" stroke-linejoin="round"/><path d="' + sh[1] + '" fill="' + T1 + '"/><path d="' + sh[2] + '" fill="' + T3 + '"/>';
      g.setAttribute('opacity', '0');
      (c.kind === 'cargo' ? ff : fb).appendChild(g);
      c.el = g; c.layer = c.kind === 'cargo' ? 'f' : 'b';
    });
  })();
  function clodAt(c, t) {
    if (t < c.t0 || t > c.end) return null;
    if (t < c.td) {
      const S = stateAt(t), A = armAt(S), p = anchorWorld(S, A, c.xl, c.yl);
      const k = E('back.out(2)')(ramp(t, c.t0, c.t0 + 0.07));
      return { x: p.x, y: p.y, rot: c.rot0 + (S.a3 - 120) * 0.2, s: c.size * k, back: false };
    }
    if (t < c.tl) {
      const tau = t - c.td;
      return { x: c.x0 + c.vx * tau, y: c.y0 + c.vy * tau + 0.5 * GRAV * tau * tau, rot: c.rot0 + c.vr * tau, s: c.size, back: true };
    }
    const s = t - c.tl, fade = 1 - E('power2.in')(ramp(s, c.hold, c.hold + c.fade));
    const bounce = s < 0.07 ? -Math.abs(Math.sin(s / 0.07 * Math.PI)) * 3.2 : 0;
    return { x: c.xl2 + c.vx * 0.06 * Math.min(s, 0.12), y: c.floor + bounce, rot: c.rot0 + c.vr * (c.tl - c.td) + 40 * Math.min(s, 0.12), s: c.size * fade * (1 + 0.1 * (1 - fade)), back: true };
  }
  // montón continuo dentro de la cuchara (detrás de las letras)
  (function buildHeap() {
    $('exc-heap').innerHTML = '<g id="exc-heapS"><path d="M -10 12 C -4 38 34 46 56 38 C 74 33 86 24 92 12 Z" fill="' + T2 + '" stroke="' + T4 + '" stroke-width="1" stroke-linejoin="round"/><path d="M -6 16 C 2 36 34 42 56 34 C 70 31 80 24 86 16" fill="none" stroke="' + T1 + '" stroke-width="3.4" stroke-linecap="round"/><path d="M 10 22 q 6 4 12 0 M 44 28 q 6 3 12 -1" fill="none" stroke="' + T3 + '" stroke-width="2" stroke-linecap="round"/></g>';
  })();
  const heapS = $('exc-heapS');
  function heapAt(t) {
    let h = 0;
    CYC.forEach((C) => { const a = Math.min.apply(null, C.rel); h = Math.max(h, E('back.out(1.4)')(ramp(t, C.pick - 0.05, C.pick + 0.08)) * (1 - E('power2.in')(ramp(t, a - 0.08, a + 0.04)))); });
    return h;
  }

  /* ====================================================================================================
     PARTÍCULAS: polvo, humo, polvo de impacto
     ==================================================================================================== */
  const PUFFS = [];
  (function buildPuffs() {
    const r = rng(5);
    const add = (o) => { PUFFS.push(o); };
    const emit = (t, x, y, o) => add(Object.assign({ t0: t, x, y, vx: 0, vy: 0, ay: 0, r0: 3, r1: 12, a: 0.6, life: 0.5, kind: 'dust', layer: 'f' }, o));
    // 1) humo del escape (mundo): sale de la chimenea con la torreta; el paso se acorta con la velocidad para que la estela sea continua
    const vX = (t) => Math.abs(seg(XK, t + 0.01) - seg(XK, t - 0.01)) / 0.02;
    for (let t = 0.0; t < 3.4; t += clamp(14 / Math.max(vX(t), 1), 0.016, 0.075)) {
      const S = stateAt(t), p = toWorld(S, -41, -142), act = clamp(Math.abs(seg(WYK, t + 0.05) - seg(WYK, t - 0.05)) / 20, 0, 1) + (t < 0.7 ? 0.5 : 0);
      emit(t, p.x + (r() - 0.5) * 2, p.y, { vx: -16 - r() * 16 + (t < 0.7 ? -60 : 0) + (t > 2.6 ? 40 : 0), vy: -46 - r() * 22 - act * 26, r0: 4.4 + act, r1: 12 + act * 7 + r() * 3, a: 0.75 + act * 0.2, life: 0.95 + r() * 0.3, kind: 'smoke', layer: 'f' });
    }
    // 2) polvo de oruga al entrar y al salir, y al frenar
    for (let t = 0.03; t < 0.66; t += clamp(10 / Math.max(vX(t), 1), 0.012, 0.04)) {
      const X = seg(XK, t), sp = vX(t);
      if (sp < 80) continue;
      emit(t, X - 86, 321, { vx: -30 - r() * 40 - sp * 0.05, vy: -14 - r() * 18, r0: 4, r1: 15 + sp * 0.01, a: 0.8, life: 0.55 + r() * 0.2, layer: 'b' });
    }
    for (let t = 0.44; t < 0.66; t += 0.026) emit(t, MX + 84 + (t - 0.44) * 60, 321, { vx: 90 + r() * 70, vy: -16 - r() * 26, r0: 5, r1: 22 + r() * 8, a: 0.95, life: 0.6, layer: 'f' });
    for (let t = 2.8; t < 3.5; t += clamp(10 / Math.max(vX(t), 1), 0.012, 0.04)) {
      const X = seg(XK, t), sp = vX(t);
      if (sp < 60) continue;
      emit(t, X + 88, 321, { vx: 30 + r() * 40 + sp * 0.05, vy: -14 - r() * 18, r0: 4, r1: 15 + sp * 0.01, a: 0.8, life: 0.55 + r() * 0.2, layer: 'b' });
    }
    // 3) polvo al crecer y al hundirse el montículo
    for (let t = 0.06; t < 0.42; t += 0.028) emit(t, 200 + r() * 106, 320, { vx: (r() - 0.5) * 40, vy: -18 - r() * 22, r0: 5, r1: 17 + r() * 8, a: 0.85, life: 0.55 + r() * 0.2, layer: 'b' });
    for (let t = 2.05; t < 2.6; t += 0.04) emit(t, 205 + r() * 94, 320, { vx: (r() - 0.5) * 30, vy: -12 - r() * 18, r0: 4, r1: 15 + r() * 6, a: 0.7, life: 0.55, layer: 'f' });
    // 4) polvo del escarbado: en la punta de los dientes
    [[0.55, 0.74], [1.37, 1.54]].forEach(([a, b]) => {
      for (let t = a; t < b; t += 0.018) {
        const S = stateAt(t), A = armAt(S), p = anchorWorld(S, A, 96, 10);
        if (p.y < 296) continue;
        emit(t, p.x, Math.min(p.y, 318), { vx: 20 + r() * 70, vy: -20 - r() * 40, r0: 4, r1: 15 + r() * 8, a: 0.9, life: 0.5, layer: 'f' });
      }
    });
    // 5) terrones y letras al aterrizar
    CLODS.forEach((c) => { if (c.kind === 'cargo' && c.xl2 > 440 && c.xl2 < 600) emit(c.tl, c.xl2, c.floor + c.size * 0.4, { vx: (r() - 0.5) * 50, vy: -14 - r() * 20, r0: 3, r1: 9 + c.size * 0.5, a: 0.8, life: 0.42, kind: 'pale', layer: 'b' }); });
    LET.forEach((L) => { [-1, 1].forEach((d) => emit(L.land, L.cx + d * 12, SLAB - 1.5, { vx: d * (46 + r() * 30), vy: -10 - r() * 10, r0: 3, r1: 11, a: 0.85, life: 0.45, kind: 'pale', layer: 'b' })); });
    // 6) vaivén de polvo al soltar la carga
    CYC.forEach((C) => { for (let k = 0; k < 6; k++) { const tt = Math.min.apply(null, C.rel) - 0.04 + k * 0.025; const xx = LET[C.letters[0]].cx + (k - 2.5) * (C.letters.length > 1 ? 24 : 12); emit(tt, xx, SLAB - 3, { vx: (r() - 0.5) * 60, vy: -16 - r() * 16, r0: 3, r1: 13 + r() * 5, a: 0.7, life: 0.5, kind: 'pale', layer: 'b' }); } });
  })();
  (function buildPool() {
    const fb = $('exc-fxBack'), ff = $('exc-fxFront');
    PUFFS.forEach((p, i) => {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('r', '1'); c.setAttribute('opacity', '0');
      c.setAttribute('fill', p.kind === 'smoke' ? 'url(#exc-gSmoke)' : p.kind === 'pale' ? 'url(#exc-gPale)' : 'url(#exc-gDust)');
      (p.layer === 'b' ? fb : ff).appendChild(c);
      p.el = c;
    });
  })();
  function puffAt(p, t) {
    const tau = t - p.t0;
    if (tau < 0 || tau > p.life) return null;
    const q = tau / p.life, k = tau - tau * tau / (2 * p.life);
    const a = p.a * Math.pow(1 - q, 1.5) * Math.min(1, q * 14);
    return { x: p.x + p.vx * k, y: p.y + p.vy * k + 0.5 * p.ay * tau * tau, r: p.r0 + (p.r1 - p.r0) * Math.sqrt(q), a };
  }

  /* ====================================================================================================
     RENDER
     ==================================================================================================== */
  const gMachine = $('exc-machine'), gArm = $('exc-gArm'), gHouse = $('exc-gHouse'), gTrack = $('exc-gTrack');
  const wheelEls = WHEELS.map((w) => $(w.id));
  const opHead = $('exc-opHead'), opBody = $('exc-opBody'), opArm = $('exc-opArm'), opHand = $('exc-opHand'), lever = $('exc-lever');
  const lastMachine = { v: '' };
  let cyl3 = null;
  function setCyl(c, a, b, L) {
    const ang = Math.atan2(b.v - a.v, b.u - a.u) / D2R;
    c.g.setAttribute('transform', 'translate(' + f2(a.u) + ' ' + f2(a.v) + ') rotate(' + f2(ang) + ')');
    const rodLen = L - c.lb + 14;
    c.rod.setAttribute('width', f2(Math.max(2, rodLen))); c.rodH.setAttribute('width', f2(Math.max(2, rodLen)));
    c.eye.setAttribute('cx', f2(L)); c.eye2.setAttribute('cx', f2(L));
  }
  function render(t) {
    t = clamp(t, 0, 5.6);
    const S = stateAt(t), A = armAt(S), K = linkAt(A), C = cylsAt(A, K);
    // máquina completa (cabeceo y hundimiento)
    gMachine.setAttribute('transform', 'translate(' + f2(S.X) + ' ' + f2(GROUND + S.dy) + ') rotate(' + f2(S.pitch) + ')');
    gMachine.setAttribute('visibility', S.X < -228 || t > 3.9 ? 'hidden' : 'visible');
    const vib = (Math.sin(t * 97) * 0.32 + Math.sin(t * 61 + 1) * 0.22) * (1 + 0.8 * loadF(t));
    const tx = 'translate(0 ' + f2(vib) + ') scale(' + (Math.round(S.sx * 1000) / 1000) + ' 1)';
    gArm.setAttribute('transform', tx); gHouse.setAttribute('transform', tx);
    shd1.setAttribute('cx', f2(S.X - 4)); shd2.setAttribute('cx', f2(S.X - 4));
    shd1.setAttribute('opacity', S.X < -230 || t > 3.9 ? 0 : 1); shd2.setAttribute('opacity', S.X < -230 || t > 3.9 ? 0 : 0.34);
    // orugas
    const D = S.X - MX;
    CHAINS.forEach((c) => c.setAttribute('stroke-dashoffset', f2(-(D * c._k) % c._per)));
    WHEELS.forEach((w, i) => wheelEls[i].setAttribute('transform', 'rotate(' + f2((D / w.r) / D2R % 360) + ')'));
    // brazo
    gBoom.setAttribute('transform', 'translate(' + P0.u + ' ' + P0.v + ') rotate(' + f2(A.a1 / D2R) + ')');
    const st = 'translate(' + f2(A.E1u) + ' ' + f2(A.E1v) + ') rotate(' + f2(A.a2 / D2R) + ')';
    gStick.setAttribute('transform', st); gLink.setAttribute('transform', st);
    gBucket.setAttribute('transform', 'translate(' + f2(A.Wu) + ' ' + f2(A.Wv) + ') rotate(' + f2(A.a3 / D2R) + ')');
    gPlate.setAttribute('transform', 'translate(' + KPT.x + ' ' + KPT.y + ') rotate(' + f2(K.phi / D2R) + ')');
    const dl = 'M ' + f2(K.Dx) + ' ' + f2(K.Dy) + ' L ' + f2(K.Bx) + ' ' + f2(K.By);
    dogA.setAttribute('d', dl); dogB.setAttribute('d', dl);
    $('exc-dogE1').setAttribute('transform', 'translate(' + f2(K.Dx) + ' ' + f2(K.Dy) + ')'); $('exc-dogE2').setAttribute('transform', 'translate(' + f2(K.Bx) + ' ' + f2(K.By) + ')');
    // la «B» del eslabón: el centro del brazo apunta a (W) con a2; el cilindro de la cuchara va de CBS a A (marco del brazo)
    setCyl(CYL.boom, C.boom.a, C.boom.b, C.boom.L); setCyl(CYL.arm, C.arm.a, C.arm.b, C.arm.L); setCyl(CYL.buck, C.buck.a, C.buck.b, C.buck.L);
    // operario
    const dA = (stateAt(t + 0.02).Wu - stateAt(t - 0.02).Wu) / 0.04, bob = Math.sin(t * 22) * 0.5 + clamp(S.pitch * 0.8, -1.5, 1.5);
    opHead.setAttribute('transform', 'translate(' + f2(clamp(dA / 700, -3, 3)) + ' ' + f2(bob) + ') rotate(' + f2(clamp(dA / 160, -8, 8)) + ' 15 -120)');
    const lv = clamp(dA / 40, -22, 22);
    lever.setAttribute('transform', 'translate(31 -90) rotate(' + f2(lv) + ')');
    const hx = 31 + Math.sin(lv * D2R) * 12.5, hy = -90 - Math.cos(lv * D2R) * 12.5;
    opArm.setAttribute('d', 'M 14 ' + f2(-108 + bob * 0.6) + ' L ' + f2(hx) + ' ' + f2(hy + 1)); opHand.setAttribute('cx', f2(hx)); opHand.setAttribute('cy', f2(hy + 1));
    // brillos que recorren la pluma y el brazo, antena y baliza
    $('exc-glB').setAttribute('transform', 'translate(' + f2(30 + ((A.a1 / D2R + 95) / 80) * 150) + ' 0)');
    $('exc-glS').setAttribute('transform', 'translate(' + f2(10 + ((A.a2 / D2R - 10) / 115) * 150) + ' 0)');
    const spd = Math.hypot(dA, (stateAt(t + 0.02).Wv - stateAt(t - 0.02).Wv) / 0.04), act = clamp(spd / 1400, 0, 1);
    $('exc-ant').setAttribute('transform', 'translate(-4 -150) rotate(' + f2(3.2 * Math.sin(t * 15) * (0.25 + act) - clamp(accX(t) / 450, -6, 6) - S.pitch * 0.7) + ')');
    $('exc-beaconG').setAttribute('opacity', (t * 2.6) % 1 < 0.38 ? '0.95' : '0.08');
    // montículo
    const M = moundAt(t);
    mG.setAttribute('visibility', M.vis ? 'visible' : 'hidden'); $('exc-skG').setAttribute('visibility', M.vis ? 'visible' : 'hidden');
    if (M.vis) {
      const d = smoothPath(M.pts, false), dc = d + ' L ' + f2(MX0 + 90) + ' 326 L ' + MX0 + ' 326 Z';
      mClip.setAttribute('d', dc); mTop.setAttribute('d', d); mEdge.setAttribute('d', d);
      mTop2.setAttribute('d', d); mTop2.setAttribute('transform', 'translate(0 3)');
      const skS = mix(1, 0.62, M.a) * mix(1, 0.45, M.b) * (1 - M.sink) * clamp(M.rise * 1.2, 0, 1.15);
      $('exc-skG').setAttribute('transform', 'translate(0 324) scale(1 ' + f2(Math.max(skS, 0.001)) + ') translate(0 -324)');
    }
    $('exc-bmud').setAttribute('opacity', f2(0.9 * ramp(t, 0.6, 0.7)));
    // montón de la cuchara
    const hs = heapAt(t);
    heapS.setAttribute('transform', 'translate(0 12) scale(1 ' + f2(Math.max(hs, 0.001)) + ') translate(0 -12)');
    heapS.setAttribute('visibility', hs > 0.01 ? 'visible' : 'hidden');
    // letras
    LET.forEach((L) => {
      const p = letterPose(L, t);
      if (p === null) { L.g.setAttribute('opacity', '0'); L.g.removeAttribute('transform'); return; }
      if (p === 'done') { L.g.setAttribute('opacity', '1'); L.g.removeAttribute('transform'); return; }
      L.g.setAttribute('opacity', f2(p.op));
      L.g.setAttribute('transform', 'translate(' + f2(L.cx + p.dx) + ' ' + f2(SLAB + p.dy) + ') rotate(' + f2(p.rot) + ') scale(' + f2(p.sx) + ' ' + f2(p.sy) + ') translate(' + f2(-L.cx) + ' ' + (-SLAB) + ')');
    });
    // tierra pegada, sombra de caída
    LET.forEach((L) => {
      const sp = t < L.rel ? 0 : ramp(t, L.rel, L.land), so = t < L.pick || t >= L.land ? 0 : 1 - ramp(sp, 0.72, 1);
      L.sm.setAttribute('opacity', f2(so));
      L.sm.setAttribute('transform', 'translate(0 296) scale(1 ' + f2(Math.max(0.02, 1 - E('power2.in')(sp))) + ') translate(0 -296)');
      const sh = t < L.rel ? 0 : t < L.land ? 0.5 * Math.pow(ramp(t, L.rel, L.land), 1.6) : 0.5 * (1 - ramp(t, L.land, L.land + 0.14));
      L.sh.setAttribute('opacity', f2(sh));
    });
    HINTS.forEach((q) => {
      const o = ramp(t, q.t0, q.t0 + 0.1) * (1 - ramp(t, q.t1, q.t1 + 0.03));
      if (o <= 0.001 || !M.vis) { q.el.setAttribute('opacity', '0'); return; }
      const k = clamp((q.x - MX0) / MXS, 0, 10.999), i0 = Math.floor(k), yy = mix(M.pts[i0][1], M.pts[i0 + 1][1], k - i0);
      q.el.setAttribute('opacity', f2(o)); q.el.setAttribute('transform', 'translate(0 ' + f2(yy + 1.5) + ')');
    });
    // terrones
    const fb = $('exc-clodsBack'), ff = $('exc-clodsFront');
    CLODS.forEach((c) => {
      const q = clodAt(c, t);
      if (!q) { if (c.on) { c.el.setAttribute('opacity', '0'); c.on = false; } return; }
      if (q.back !== (c.layer === 'b')) { (q.back ? fb : ff).appendChild(c.el); c.layer = q.back ? 'b' : 'f'; }
      c.on = true; c.el.setAttribute('opacity', '1');
      c.el.setAttribute('transform', 'translate(' + f2(q.x) + ' ' + f2(q.y) + ') rotate(' + f2(q.rot) + ') scale(' + f2(Math.max(q.s, 0.01)) + ')');
    });
    // polvo y humo
    PUFFS.forEach((p) => {
      const q = puffAt(p, t);
      if (!q) { if (p.on) { p.el.setAttribute('opacity', '0'); p.on = false; } return; }
      p.on = true;
      p.el.setAttribute('cx', f2(q.x)); p.el.setAttribute('cy', f2(q.y)); p.el.setAttribute('r', f2(q.r)); p.el.setAttribute('opacity', f2(q.a));
    });
    return S;
  }

  /* ====================================================================================================
     LÍNEA DE TIEMPO: un tween lineal 0 → 5,6 s cuyo único efecto es llamar a render(t)
     ==================================================================================================== */
  const clock = {};
  let _t = 0;
  Object.defineProperty(clock, 't', { get() { return _t; }, set(v) { _t = v; render(v); } });
  const tl = gsap.timeline({ paused: true });
  tl.to(clock, { t: 5.6, duration: 5.6, ease: 'none' }, 0);
  render(0);
  window.__exc = { stateAt, armAt, linkAt, cylsAt, STATS, LET, CLODS, PUFFS, render, letterPose };
  window.__timelines = window.__timelines || {};
  window.__timelines['main'] = tl;
})();
