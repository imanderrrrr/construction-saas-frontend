name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (Vite / Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # Errors gate the build; the legacy backlog is tracked as warnings with
      # per-rule counts in eslint.config.js — tighten rule by rule, not here.
      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      # AUD-019: the JavaScript of the landing's first anonymous view (entry,
      # its static imports, the landing chunk and its translations, per
      # language) stays within 400 000 bytes gzip, and carries no dashboard,
      # platform console, PDF/QR library or admin/other-language translations.
      - name: Bundle budget (landing first view)
        run: npm run budget
